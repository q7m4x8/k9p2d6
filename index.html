<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff9f2">
  <meta name="description" content="小天爱刷题 - 政治理论刷题、错题复习与进度管理">
  <title>小天爱刷题</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=20261121-5">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="brandButton" class="brand" aria-label="返回练习首页">
        <span class="brand-mark">天</span>
        <span>小天爱刷题</span>
      </button>
      <div class="top-actions">
        <span class="status-pill"><i></i> 本机已保存</span>
        <button id="fontButton" class="guide-pill" aria-label="调整全局字号">字号</button>
        <button id="guideButton" class="guide-pill">新手必看</button>
        <div id="themePicker" class="theme-picker" aria-label="主题色"></div>
      </div>
    </header>

    <main id="mainContent" class="main-content" aria-live="polite">
      <div class="loading-card">正在载入题库…</div>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button data-route="home" class="nav-item active"><span>⌂</span><em>练习</em></button>
      <button data-route="progress" class="nav-item"><span>▥</span><em>进度</em></button>
      <button data-route="wrong" class="nav-item"><span>×</span><em>错题</em></button>
      <button data-route="favorites" class="nav-item"><span>★</span><em>收藏</em></button>
    </nav>

    <div id="toast" class="toast" role="status"></div>
    <div id="modalRoot"></div>
  </div>
  <script src="./app.js?v=20261121-5" defer></script>
</body>
</html>
