<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff9f2">
  <meta name="description" content="小天爱刷题 - 政治理论、张弓选词大典、错题复习与进度管理">
  <title>小天爱刷题</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=20261123-8">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-group">
        <button id="backButton" class="header-back" aria-label="返回上一页" hidden><svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/></svg><span>返回</span></button>
        <button id="brandButton" class="brand" aria-label="返回练习首页">
          <span class="brand-mark">天</span>
          <span>小天爱刷题</span>
        </button>
      </div>
      <div class="top-actions">
        <span class="status-pill"><i></i> 本机已保存</span>
        <div id="quizTimer" class="quiz-timer" aria-label="答题计时" hidden><span>本题 <b id="questionTimer">00:00</b></span><span>总计 <b id="sessionTimer">00:00</b></span></div>
        <button id="fontButton" class="guide-pill" aria-label="调整全局字号">字号</button>
        <button id="guideButton" class="guide-pill">新手必看</button>
        <div id="themePicker" class="theme-picker" aria-label="主题色"></div>
      </div>
    </header>

    <main id="mainContent" class="main-content" aria-live="polite">
      <div class="loading-card">正在载入题库…</div>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button data-route="home" class="nav-item active"><span>⌂</span><em>练习</em></button>
      <button data-route="progress" class="nav-item"><span>▥</span><em>进度</em></button>
      <button data-route="wrong" class="nav-item"><span>×</span><em>错题</em></button>
      <button data-route="favorites" class="nav-item"><span>★</span><em>收藏</em></button>
    </nav>

    <div id="toast" class="toast" role="status"></div>
    <div id="modalRoot"></div>
  </div>
  <script src="./text-format.js?v=20261122-4" defer></script>
  <script src="./reference-reviews.js?v=20261123-5" defer></script>
  <script src="./option-reviews.js?v=20261122-4" defer></script>
  <script src="./explanation-format.js?v=20261123-5" defer></script>
  <script src="./bank-loader.js?v=20261123-8" defer></script>
  <script src="./app.js?v=20261123-8" defer></script>
</body>
</html>
