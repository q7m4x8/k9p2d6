<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff9f2">
  <meta name="description" content="小天爱刷题 - 政治理论、言语理解、图形推理与错题复习">
  <title>小天爱刷题</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=20261127-3">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-group">
        <button id="backButton" class="header-back" aria-label="返回上一页" hidden><svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/></svg><span>返回</span></button>
        <button id="brandButton" class="brand" aria-label="返回练习首页">
          <span class="brand-mark">天</span>
          <span>小天爱刷题</span>
        </button>
      </div>
      <div class="top-actions">
        <button type="button" id="studySyncButton" class="guide-pill study-sync-button" aria-label="登录" disabled>登录</button>
        <div id="quizTimer" class="quiz-timer" aria-label="答题计时" hidden><span>本题 <b id="questionTimer">00:00</b></span><span>总计 <b id="sessionTimer">00:00</b></span></div>
        <button id="fontButton" class="guide-pill" aria-label="调整全局字号">字号</button>
        <button id="guideButton" class="guide-pill">新手必看</button>
        <div id="themePicker" class="theme-picker" aria-label="主题色"></div>
      </div>
    </header>

    <main id="mainContent" class="main-content" aria-live="polite">
      <div class="loading-card">正在载入题本目录…</div>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button data-route="home" class="nav-item active"><span>⌂</span><em>练习</em></button>
      <button data-route="progress" class="nav-item"><span>▥</span><em>进度</em></button>
      <button data-route="wrong" class="nav-item"><span>×</span><em>错题</em></button>
      <button data-route="favorites" class="nav-item"><span>★</span><em>收藏</em></button>
    </nav>

    <div id="toast" class="toast" role="status"></div>
    <div id="modalRoot"></div>
    <dialog id="studySyncDialog" class="modal study-sync-dialog" aria-labelledby="studySyncTitle"></dialog>
    <dialog id="diagramZoomDialog" class="diagram-zoom-dialog" aria-labelledby="diagramZoomTitle">
      <header class="diagram-zoom-bar"><h2 id="diagramZoomTitle">查看题图</h2><button type="button" class="mini-btn ghost" data-action="diagram-zoom-close" autofocus>关闭</button></header>
      <div class="diagram-zoom-view" tabindex="0" aria-label="拖动查看放大的题图"><div class="diagram-image-frame diagram-zoom-image"><img alt="" draggable="false"></div></div>
      <footer class="diagram-zoom-bar diagram-zoom-controls">
        <button type="button" class="mini-btn" data-action="diagram-zoom-out" aria-label="缩小题图">−</button><output class="diagram-zoom-level" aria-live="polite"></output><button type="button" class="mini-btn" data-action="diagram-zoom-in" aria-label="放大题图">+</button>
        <button type="button" class="mini-btn ghost" data-action="diagram-zoom-fit">适合屏幕</button><button type="button" class="mini-btn ghost" data-action="diagram-zoom-original">完整原题</button>
      </footer>
    </dialog>
  </div>
  <script src="./text-format.js?v=20261122-4" defer></script>
  <script src="./explanation-format.js?v=20261123-5" defer></script>
  <script id="bankLoader" src="./bank-loader.js?v=20261127-1" defer></script>
  <script id="bankCatalog" src="./data/bank-catalog.js?v=20261127-2" defer></script>
  <script src="./annotation.js?v=20261125-5" defer></script>
  <script src="./study-sync-data.js?v=20261127-3" defer></script>
  <script src="./study-sync-client.js?v=20261127-1" defer></script>
  <script src="./study-pairing-client.js?v=20261127-1" defer></script>
  <script src="./study-sync.js?v=20261127-4" defer></script>
  <script src="./app.js?v=20261127-4" defer></script>
</body>
</html>
